# Настройки для бесплатного хостинга Render (New -> Blueprint)
services:
  - type: web
    name: campuseats
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/dishes
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campuseats-db
          property: connectionString

databases:
  - name: campuseats-db
    plan: free
